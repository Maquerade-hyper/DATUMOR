services:
  postgres:
    image: postgres:16-alpine
    container_name: datumor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - datumor_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7.4-alpine
    container_name: datumor-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - datumor_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 15

  seaweedfs:
    image: chrislusf/seaweedfs@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8333:8333"
    environment:
      AWS_ACCESS_KEY_ID: ${DATUMOR_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${DATUMOR_S3_SECRET_KEY}
      S3_BUCKET: datumor
    volumes:
      - weed_data:/data

  datumor-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: datumor:local
    env_file:
      - .env
    environment:
      DATUMOR_DB_USER: ${POSTGRES_USER}
      DATUMOR_DB_PASSWORD: ${POSTGRES_PASSWORD}
      DATUMOR_DB_NAME: ${POSTGRES_DB}
      DATUMOR_DB_HOST: postgres
      DATUMOR_DB_PORT: 5432
    command: ["python", "scripts/migrate.py"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: datumor:local
    container_name: datumor-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATUMOR_DB_USER: ${POSTGRES_USER}
      DATUMOR_DB_PASSWORD: ${POSTGRES_PASSWORD}
      DATUMOR_DB_NAME: ${POSTGRES_DB}
      DATUMOR_DB_HOST: postgres
      DATUMOR_DB_PORT: 5432
      DATUMOR_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DATUMOR_S3_ENDPOINT: http://seaweedfs:8333
      DATUMOR_STAGING_DIR: /app/data/staging
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - datumor_data:/app/data
    command: ["uvicorn", "apps.api.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      datumor-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: datumor:local
    container_name: datumor-worker
    user: "65534:65534"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATUMOR_DB_USER: ${POSTGRES_USER}
      DATUMOR_DB_PASSWORD: ${POSTGRES_PASSWORD}
      DATUMOR_DB_NAME: ${POSTGRES_DB}
      DATUMOR_DB_HOST: postgres
      DATUMOR_DB_PORT: 5432
      DATUMOR_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DATUMOR_S3_ENDPOINT: http://seaweedfs:8333
      DATUMOR_STAGING_DIR: /app/data/staging
    volumes:
      - datumor_data:/app/data
    command: ["python", "-m", "apps.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      datumor-migrate:
        condition: service_completed_successfully

volumes:
  datumor_postgres:
  datumor_redis:
  datumor_minio:
  weed_data: {}
  datumor_data:
